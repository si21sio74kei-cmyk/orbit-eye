<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太阳系手势控制 | DSM-7 v12</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>if(!window.THREE)document.write('<script src="https://unpkg.com/three@0.128.0/build/three.min.js"><\/script>');</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/4.0.0/satellite.min.js"></script>
<script src="/static/js/planet_shaders.js"></script>
<link rel="stylesheet" href="/static/css/solar.css">
</head>
<body>

<canvas id="ss-canvas"></canvas>
<video id="webcam-pip" playsinline autoplay muted></video>
<canvas id="hand-overlay"></canvas>

<div id="hud-top">🟢 DSM v12 | ☝️边缘切星 | ✌️双指捏合=信息卡 | 🖐全张=近距 | ✊地球=卫星网 | ☄️小行星带 | 🌙月球</div>
<div id="planet-card"></div>
<div id="swipe-alert"></div>
<div id="hover-zone-left"></div>
<div id="hover-zone-right"></div>

<div id="ctrl-panel">
  <a href="/" class="ctrl-btn">&#9664; 返回仪表盘</a>
  <button id="btn-cam" class="ctrl-btn">📷 启动摄像头</button>
  <button id="btn-rst" class="ctrl-btn">☀ 重置视角</button>
  <div class="pnl corner" style="padding:10px;">
    <div style="font-family:var(--title);font-size:9px;color:var(--label);margin-bottom:6px;">时间流速 <span id="speed-label" style="color:var(--primary);">1.0x</span></div>
    <input type="range" id="speed-slider" min="0.1" max="5" step="0.1" value="1" style="width:100%;accent-color:var(--primary);">
  </div>
</div>

<div id="status-panel" class="pnl corner" style="padding:12px;">
  <div style="font-family:var(--title);font-size:9px;color:var(--label);border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:6px;">🖐 手势状态</div>
  <div class="row"><span class="k">当前行星</span><span class="v" id="st-planet" style="font-size:12px;">太阳</span></div>
  <div class="row"><span class="k">手势模式</span><span class="v" id="st-mode">等待输入</span></div>
  <div class="row"><span class="k">手掌开合</span><span class="v" id="st-open">--</span></div>
  <div class="row"><span class="k">摄像头</span><span class="v" id="st-cam">关闭</span></div>
</div>

<div id="sat-overlay">
  <div class="header">
    <span class="title">🛰 地球卫星分布图</span>
    <button onclick="closeSatMap()" class="ctrl-btn">关闭</button>
  </div>
  <div style="flex:1;display:flex;">
    <div id="sat-globe"></div>
    <div id="sat-list" style="color:var(--dim);">手势：食指悬停左边缘可退出<br>全张开=放大旋转 | 握拳=缩小</div>
  </div>
</div>

<script src="/static/js/solar.js"></script>
</body>
</html>
