<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070b12">
<title>太阳系手势控制 | DSM-7 v12</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='7' fill='%236cb6e8'/%3E%3Cellipse cx='32' cy='32' rx='27' ry='11' fill='none' stroke='%236cb6e8' stroke-width='2' transform='rotate(-22 32 32)'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>if(!window.THREE)document.write('<script src="https://unpkg.com/three@0.128.0/build/three.min.js"><\/script>');</script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/4.0.0/satellite.min.js"></script>
<script src="/static/js/planet_shaders.js"></script>
<script src="/static/js/deep_space.js"></script>
<link rel="stylesheet" href="/static/css/solar.css">
</head>
<body>

<canvas id="ss-canvas"></canvas>
<video id="webcam-pip" playsinline autoplay muted></video>
<canvas id="hand-overlay"></canvas>

<nav id="hud-top" aria-label="手势操作提示"><span class="brand">DSM·ATLAS</span><span class="gesture" data-gesture="edge"><b>01</b>边缘切星</span><span class="gesture" data-gesture="pinch"><b>02</b>捏合信息卡</span><span class="gesture" data-gesture="fist"><b>03</b>握拳推近</span><span class="gesture" data-gesture="openSpin"><b>04</b>张手旋转</span><span class="gesture" data-gesture="open"><b>05</b>张手拉远</span><span class="gesture" data-gesture="two"><b>06</b>双指卫星网</span><span class="gesture" data-gesture="warp"><b>07</b>越过海王星→更多</span></nav>
<div id="void-pressure" aria-hidden="true"></div>
<div id="planet-card"></div>
<div id="swipe-alert"></div>
<div id="warp-overlay" aria-hidden="true"><div class="warp-lines"></div><div class="warp-flash"></div></div>
<div id="hover-zone-left"></div>
<div id="hover-zone-right"></div>

<div id="ctrl-panel">
  <a href="/" class="ctrl-btn">返回仪表盘</a>
  <button id="btn-cam" class="ctrl-btn">启动摄像头</button>
  <button id="btn-rst" class="ctrl-btn">重置视角</button>
  <div class="pnl corner">
    <div class="pnl-in">
      <div style="font-family:var(--display);font-size:10px;font-weight:500;letter-spacing:1px;color:var(--dim);margin-bottom:8px;">时间流速 <span id="speed-label" style="color:var(--primary);font-family:var(--mono);">1.0x</span></div>
      <input type="range" id="speed-slider" min="0.1" max="5" step="0.1" value="1" style="width:100%;accent-color:var(--primary);">
    </div>
  </div>
</div>

<div id="status-panel" class="pnl corner">
  <div class="pnl-in">
    <div class="hd">Gesture Telemetry · 手势状态</div>
    <div class="row"><span class="k">当前目标</span><span class="v" id="st-planet" style="font-size:12px;">太阳</span></div>
    <div class="row"><span class="k">手势模式</span><span class="v" id="st-mode">等待输入</span></div>
    <div class="row"><span class="k">手掌开合</span><span class="v" id="st-open">--</span></div>
    <div class="row"><span class="k">摄像头</span><span class="v" id="st-cam">关闭</span></div>
  </div>
</div>

<div id="sat-overlay">
  <div class="header">
    <span class="title">地球卫星分布图 <small>EARTH ORBITAL NETWORK</small></span>
    <button onclick="closeSatMap()" class="ctrl-btn">关闭</button>
  </div>
  <div style="flex:1;display:flex;">
    <div id="sat-globe"></div>
    <div id="sat-list" style="color:var(--dim);">手势：食指悬停左边缘可退出<br>握拳=推近 | 张手=拉远 | 左右滑动换视角</div>
  </div>
</div>

<script src="/static/js/solar.js"></script>
</body>
</html>
